[package]
name = "half2k"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true

# Kept separate from `release` so that a profiling build never has to be a
# different set of flags typed from memory.
[profile.release-debug]
inherits = "release"
debug = true
strip = false
